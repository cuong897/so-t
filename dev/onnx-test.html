<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Soát — kiểm chứng đường ONNX</title>
<style>
  body { font: 400 15px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif;
         max-width: 820px; margin: 32px auto; padding: 0 20px; }
  h1 { font-size: 19px; font-weight: 600; }
  .muted { color: #666; font-size: 13px; }
  pre { background: #f6f8fa; padding: 14px; border-radius: 8px; white-space: pre-wrap;
        font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace; }
  .ok { color: #1a7f37; } .bad { color: #cf222e; font-weight: 600; }
</style>
</head>
<body>
  <h1>Kiểm chứng đường ONNX trong trình duyệt</h1>
  <p class="muted">Chạy model thật trong <code>extension/models/</code>. Kiểm tra hai
  thứ: phần ghép nối (nạp onnxruntime-web, mã hoá BPE, chặn theo tập ứng viên, ánh xạ
  offset) và <strong>khả năng bắt lỗi thật</strong> ở ngưỡng sản xuất. Thêm
  <code>?loose</code> để hạ ngưỡng về 0.</p>
  <pre id="log">đang chạy…</pre>

<script type="module">
// Cache-buster: trình duyệt cache module rất dai, sửa file xong tải lại vẫn
// chạy bản cũ — mất thời gian đuổi theo một lỗi đã sửa rồi.
const v = `?v=${Date.now()}`;
const { OnnxEngine } = await import(`../extension/src/engine/onnxEngine.js${v}`);
const { applicableTags, TAG_NAMES } = await import(`../extension/src/engine/vi.js${v}`);

const lines = [];
const say = (s, cls) => {
  lines.push(cls ? `<span class="${cls}">${s}</span>` : s);
  document.getElementById('log').innerHTML = lines.join('\n');
};
const check = (cond, msg) => say(`${cond ? '✓' : '✗'} ${msg}`, cond ? 'ok' : 'bad');

const t0 = performance.now();
// Mặc định dùng NGƯỠNG SẢN XUẤT — nếu không thì số báo động giả bên dưới vô
// nghĩa. Thêm ?loose vào URL để hạ ngưỡng về 0, dùng khi soi model hoặc
// khi muốn xem model đang nghĩ gì ở chỗ nó chưa đủ tự tin để báo.
const loose = new URLSearchParams(location.search).has('loose');
const engine = loose
  ? new OnnxEngine({ threshold: 0.0, margin: 0.0 })
  : new OnnxEngine();
const ok = await engine.load({
  ort: '../extension/vendor/ort.wasm.bundle.min.mjs',
  wasmDir: '../extension/vendor/',
  // Cache-buster cho CẢ file model. Thay model xong tải lại trang mà vẫn thấy
  // kết quả y hệt bản cũ — mất một lúc mới nhận ra đó là cache chứ không phải
  // model mới cho ra cùng con số.
  model: `../extension/models/soat.int8.onnx${v}`,
  tokenizer: `../extension/models/tokenizer.json${v}`,
  lexicon: `../extension/models/lexicon.json${v}`,
  meta: `../extension/models/soat.meta.json${v}`,
});

check(engine.ready, `nạp xong sau ${Math.round(performance.now() - t0)}ms`  + (loose ? '  — CHẾ ĐỘ ?loose, ngưỡng = 0' : `  — ngưỡng sản xuất `  + `${engine.threshold}/${engine.margin}`));
if (!engine.ready) {
  say('dừng — xem console để biết lỗi nạp', 'bad');
} else {
  check(engine.tagNames.length === TAG_NAMES.length,
        `bộ nhãn khớp vi.js (${engine.tagNames.length} nhãn)`);
  check(engine.lexicon.size > 5000, `từ điển ${engine.lexicon.size.toLocaleString()} âm tiết`);

  const text = 'Cả nhóm đã nổ lực rất nhiều để chia sẽ những trãi nghiệm quý báu.';
  const tA = performance.now();
  const issues = await engine.check(text);
  const infer = performance.now() - tA;

  say(`\nsuy luận: ${Math.round(infer)}ms cho câu ${text.length} ký tự`);
  check(Array.isArray(issues), `trả về mảng Issue (${issues.length} phần tử)`);

  // Bất biến 1: mọi đề xuất phải nằm trong tập ứng viên hợp lệ
  let outside = 0;
  for (const it of issues) {
    const allowed = applicableTags(it.original, engine.lexicon);
    const reachable = allowed.some((t) => t !== 'KEEP' &&
      engine.lexicon.has(it.suggestion.toLowerCase()));
    if (!reachable) outside++;
  }
  check(outside === 0, `không đề xuất nào ra ngoài từ điển (${outside} vi phạm)`);

  // Bất biến 2: offset phải trỏ đúng vào chuỗi gốc
  const badOffset = issues.filter((i) => text.slice(i.start, i.end) !== i.original);
  check(badOffset.length === 0, `offset trỏ đúng chuỗi gốc (${badOffset.length} sai)`);

  // Bất biến 3: đề xuất phải khác bản gốc
  const noop = issues.filter((i) => i.suggestion === i.original);
  check(noop.length === 0, `không có đề xuất trùng bản gốc (${noop.length} vô nghĩa)`);

  say('\nđề xuất trên câu mẫu:');
  for (const i of issues.slice(0, 6)) {
    say(`   ${i.original} → ${i.suggestion}   ${(i.confidence * 100).toFixed(0)}%  [${i.tag}]`);
  }

  // --- model có THỰC SỰ bắt được lỗi không ---------------------------------
  // Phần trên chỉ kiểm tra ghép nối. Phần này mới trả lời câu hỏi đáng tiền.
  // Model chưa train sẽ trượt hết ở ngưỡng sản xuất — đó là hành vi đúng.
  const CASES = [
    ['Cả nhóm đã nổ lực rất nhiều trong suốt học kỳ này.', 'nổ', 'nỗ'],
    ['Mình xin chia sẽ lại một vài kinh nghiệm cho các bạn.', 'sẽ', 'sẻ'],
    ['Đây là những trãi nghiệm quý báu với cả nhóm.', 'trãi', 'trải'],
    ['Chuyện đó đã xãy ra từ rất lâu rồi.', 'xãy', 'xảy'],
    ['Anh ấy luon co gang hoc tap that tot.', 'luon', 'luôn'],
    ['Toi rat vui khi duoc gap lai ban.', 'duoc', 'được'],
  ];

  say('\n--- bắt lỗi thật ---');
  let hit = 0;
  let falsePos = 0;
  for (const [sentence, bad, good] of CASES) {
    const found = await engine.check(sentence);
    const onTarget = found.find((i) => i.original === bad);
    const ok = onTarget && onTarget.suggestion === good;
    if (ok) hit++;
    falsePos += found.filter((i) => i.original !== bad).length;
    const got = onTarget ? `${onTarget.original}→${onTarget.suggestion}` : 'không thấy';
    say(`   ${ok ? '✓' : '·'} ${bad}→${good}   model: ${got}`
      + `   (+${found.filter((i) => i.original !== bad).length} chỗ khác)`);
  }
  say(`bắt được ${hit}/${CASES.length}  |  động vào ${falsePos} chỗ ngoài mục tiêu`,
      hit === CASES.length ? 'ok' : null);
  if (falsePos > CASES.length) {
    say('báo động giả cao — với sản phẩm này precision quan trọng hơn recall, '
      + 'cân nhắc nâng threshold/margin.', 'bad');
  }

  // Đo độ trễ: p50/p95 trên câu dài trung bình, giống trong Web Worker
  const times = [];
  for (let k = 0; k < 30; k++) {
    const s = performance.now();
    await engine.check(text);
    times.push(performance.now() - s);
  }
  times.sort((a, b) => a - b);
  say(`\nđộ trễ (1 luồng wasm): p50 ${times[15].toFixed(1)}ms  `
    + `p95 ${times[28].toFixed(1)}ms`);
  say('Đo trên máy này; máy người dùng yếu hơn sẽ chậm hơn.');
}
</script>
</body>
</html>
