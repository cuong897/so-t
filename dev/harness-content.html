<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Soát — chạy content/index.js thật với chrome.* giả lập</title>
<style>
  body { font: 15px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 860px; margin: 32px auto; padding: 0 20px; }
  #ed { border: 1px solid #999; border-radius: 8px; padding: 12px; min-height: 120px; }
  pre { background: #f6f8fa; padding: 12px; border-radius: 8px; white-space: pre-wrap; font: 12px/1.5 ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<h1>Content script thật, <code>chrome.*</code> giả lập</h1>
<p>
Nạp nguyên <code>extension/src/content/index.js</code> — không chép lại logic nào.
<code>?debug=1</code> đặt cờ <code>soatDebug</code>. Ô bên dưới là contenteditable
mà nội dung được thay bằng <strong>thao tác DOM trực tiếp</strong>, không bắn sự
kiện <code>input</code> — đúng thứ Lexical làm khi dán (quyết định 36).
</p>
<div id="ed" contenteditable="true" aria-label="soạn bài"></div>
<pre id="log">…</pre>
<script>
  const debugOn = new URLSearchParams(location.search).has('debug');
  const base = new URL('../extension/', location.href).href;
  window.__harness = { messages: [] };
  window.chrome = {
    runtime: {
      getURL: (p) => base + p,
      sendMessage: (m) => { window.__harness.messages.push(m); return Promise.resolve(); },
      onMessage: { addListener: () => {} },
    },
    storage: { local: {
      get: async () => (debugOn ? { soatDebug: true } : {}),
      set: async () => {},
    } },
  };
</script>
<script src="../extension/src/content/index.js"></script>
</body>
</html>
